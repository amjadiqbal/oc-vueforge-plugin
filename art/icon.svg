            fill="none" stroke="#ff6600" stroke-width="52"
            stroke-linecap="round" stroke-linejoin="round"
            transform="translate(0,26)" opacity="0.95"/>

  <polyline points="160,150 256,340 352,150"
            fill="none" stroke="#42b883" stroke-width="56"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
