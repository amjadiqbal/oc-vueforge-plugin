0.1.0: First version of VueForge.
0.1.1: Restructured the repository so the plugin sits at the repo root (Packagist packaging fix, no functional changes).
0.1.2: Added README banner, icon, and CI/license/version badges.
0.1.3: Fixed CI (jsdom 30 required Node 22+, downgraded to jsdom 25); removed internal process files from the repo.
0.1.4: Fixed composer.json package name for October CMS Marketplace compliance (must end in -plugin); added october/rain version requirement.
0.1.5: Renamed the GitHub repo to oc-vueforge-plugin, matching October CMS's repository naming convention.
0.1.6: Renamed the plugin namespace from AmjadIqbal to Amjad to match the registered October CMS Marketplace author code (composer package amjad/vueforge-plugin, installs at plugins/amjad/vueforge).
0.1.7: Decided to skip Packagist.org publication under the amjad vendor (already claimed by an unrelated package); no code change, October Marketplace distribution unaffected.
0.1.8: Reverted to the amjadiqbal identity across the board (namespace, plugin code, Composer package, install path), giving up October Marketplace eligibility under this account in exchange for a working, conflict-free Packagist/GitHub identity matching the rest of this author's packages.
0.1.9: Brought the GitHub repo up to this portfolio's repo standard - .gitattributes, .editorconfig, dependabot, dark-mode README banner and footer; no functional code changes.
